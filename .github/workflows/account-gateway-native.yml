name: Account gateway native qualification
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/account-gateway-native.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'backend/**'
      - '.github/workflows/account-gateway-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: account-gateway-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_USER: native_contract_test
          POSTGRES_DB: native_review_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U native_contract_test -d native_review_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis_repository:
        image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 127.0.0.1:6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      redis_http:
        image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 127.0.0.1:6380:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: backend/go.sum
      - name: Native boundary and ordinary regressions
        working-directory: backend
        env:
          GATEWAY_NATIVE_TEST_REDIS_ADDR: 127.0.0.1:6379
          GATEWAY_NATIVE_OAUTH_TEST_REDIS_ADDR: 127.0.0.1:6379
          GATEWAY_NATIVE_OAUTH_TEST_DSN: postgres://native_contract_test@127.0.0.1:5432/gateway_oauth_test_ci?sslmode=disable
        run: |
          set -o pipefail
          docker exec "${{ job.services.postgres.id }}" createdb -U native_contract_test gateway_oauth_test_ci
          go test -tags unit ./internal/service ./internal/handler/admin -run 'TestGatewayAccountAdmissionDoesNotTreatSubscriptionExhaustionAsCreditExhaustion|TestGatewayAccountLimitsPrivateHTTPContract|TestGatewayAccountLimitsExplicitRefresh|TestGatewayAccountLimitsRefreshPrivateHTTPContract|TestGatewayCodexQuotaProjection' -count=1
          go test -tags unit ./internal/service ./internal/repository ./internal/handler/admin -run GatewayNative -skip '^TestGatewayNativeReviewReasoningRealRedis$' -count=1 -v | tee "$RUNNER_TEMP/native-boundary.log"
          test "$(grep -c '^--- PASS: TestGatewayNativeOAuthRealRedisGuards ' "$RUNNER_TEMP/native-boundary.log")" -eq 1
          if grep -Eq '^--- SKIP: TestGatewayNativeOAuthRealRedisGuards([[:space:]]|$)' "$RUNNER_TEMP/native-boundary.log"; then exit 1; fi
          test "$(grep -c '^--- PASS: TestGatewayNativeOAuthPostgresReservationAndCustody ' "$RUNNER_TEMP/native-boundary.log")" -eq 1
          if grep -Eq '^--- SKIP: TestGatewayNativeOAuthPostgresReservationAndCustody([[:space:]]|$)' "$RUNNER_TEMP/native-boundary.log"; then exit 1; fi
          go test -tags unit ./internal/repository -run '^TestGatewayNativeReviewReasoningRealRedis$' -count=1 -v -timeout 180s | tee /tmp/native-redis-repository.log
          test "$(sed -n '/^--- PASS: TestGatewayNativeReviewReasoningRealRedis /p' /tmp/native-redis-repository.log | wc -l)" -eq 1
          go test -tags unit ./internal/service ./internal/handler/admin ./internal/pkg/apicompat -run 'RawChat|Responses.*Chat|Chat.*Responses|CCStream|GatewayNativeReviewOrdinary|BatchDelete' -count=1
      - name: Actual private HTTP, migrations, PostgreSQL and Redis
        working-directory: backend
        env:
          GATEWAY_NATIVE_TEST_PG_DSN: postgres://native_contract_test@127.0.0.1:5432/native_review_ci?sslmode=disable
          GATEWAY_NATIVE_TEST_HTTP_REDIS_ADDR: 127.0.0.1:6380
        run: |
          set -o pipefail
          go test -tags integration ./internal/handler/admin -run '^TestGatewayNativeReviewPrivateHTTPPostgres$' -count=1 -v -timeout 180s | tee /tmp/native-pg.log
          test "$(sed -n '/^--- PASS: TestGatewayNativeReviewPrivateHTTPPostgres /p' /tmp/native-pg.log | wc -l)" -eq 1
          go test -tags integration ./internal/handler/admin -run '^TestGatewayNativeReviewReasoningHTTPRedis$' -count=1 -v -timeout 180s | tee /tmp/native-redis.log
          test "$(sed -n '/^--- PASS: TestGatewayNativeReviewReasoningHTTPRedis /p' /tmp/native-redis.log | wc -l)" -eq 1

      - name: Native account facts, credential imports and official review APIs
        working-directory: backend
        env:
          GATEWAY_NATIVE_INFO_TEST_DSN: postgres://native_contract_test@127.0.0.1:5432/gateway_info_test_ci?sslmode=disable
          GATEWAY_NATIVE_IMPORT_TEST_DSN: postgres://native_contract_test@127.0.0.1:5432/gateway_import_test_ci?sslmode=disable
          GATEWAY_NATIVE_CODEX_INFO_TEST_DSN: postgres://native_contract_test@127.0.0.1:5432/gateway_info_test_codex_ci?sslmode=disable
          GATEWAY_NATIVE_CODEX_BINDING_INFO_TEST_DSN: postgres://native_contract_test@127.0.0.1:5432/gateway_info_test_codex_binding_ci?sslmode=disable
        run: |
          set -o pipefail
          docker exec "${{ job.services.postgres.id }}" createdb -U native_contract_test gateway_info_test_ci
          docker exec "${{ job.services.postgres.id }}" createdb -U native_contract_test gateway_import_test_ci
          docker exec "${{ job.services.postgres.id }}" createdb -U native_contract_test gateway_info_test_codex_ci
          docker exec "${{ job.services.postgres.id }}" createdb -U native_contract_test gateway_info_test_codex_binding_ci
          go test -tags unit ./internal/pkg/apicompat ./internal/service -run 'TestGeminiContinuation|TestResponsesToAnthropic.*StructuredOutput|TestGatewayGeminiContinuation|TestGatewayAccountInfo|TestGatewayQuotaAndInfo|TestGatewayCodex(Info|RetainedInfo|Maintenance)|TestGatewayClaudeInfo|TestGatewayGrokInfo|TestGatewayOAuthInfo|TestGatewayAccountCapabilities|TestGatewayNativeGemini|TestGatewayNativeOfficial|TestGatewayNativeAnthropicSchema' -count=1 -v | tee "$RUNNER_TEMP/native-account-info-unit.log"
          if grep -Fq -- '--- SKIP:' "$RUNNER_TEMP/native-account-info-unit.log"; then exit 1; fi
          go test -tags unit ./internal/gatewaybootstrap ./internal/handler/admin -run 'TestNativeAccountCapabilities|TestNativeOfficialAPIConfig|TestNativeConnectionCleanupAuthorityStoredTuple|TestGatewayAccountLimitsAuthorityHTTP|TestGatewayAccountInfoPrivateHTTPContract|TestGatewayNativeOAuthConnectHTTPImportStrictIngress' -count=1 -v | tee "$RUNNER_TEMP/native-account-info-http.log"
          if grep -Fq -- '--- SKIP:' "$RUNNER_TEMP/native-account-info-http.log"; then exit 1; fi
          for critical in TestNativeAccountCapabilitiesExposeImportsOnlyWithComposedCodex TestNativeOfficialAPIConfigUsesExistingClosedFD6Profiles TestNativeConnectionCleanupAuthorityStoredTuple TestGatewayAccountLimitsAuthorityHTTP TestGatewayAccountInfoPrivateHTTPContract TestGatewayNativeOAuthConnectHTTPImportStrictIngress; do
            test "$(grep -c "^--- PASS: $critical " "$RUNNER_TEMP/native-account-info-http.log")" -eq 1
          done
          for critical in TestGatewayNativeOfficialGeminiActualTLSContinuationAndSchema TestGatewayNativeOfficialAnthropicActualTLSHeadersToolsAndSchema TestGatewayGeminiContinuationBindsEveryAuthorityAndNativeIdentity TestGatewayAccountInfoReaderUsesCurrentSnapshotAndFinalAuthority; do
            test "$(grep -c "^--- PASS: $critical " "$RUNNER_TEMP/native-account-info-unit.log")" -eq 1
          done
          go test -tags integration ./internal/repository -run '^TestGateway(AccountInfoPostgresOrderingAtomicityAndReplacement|AccountInfoCodexPostgresHydrationAndRefresh|AccountInfoCodexPostgresConnectionBinding|NativeOAuthImportPostgresClaimsReplayAndLostACK)$' -count=1 -v -timeout 180s | tee "$RUNNER_TEMP/native-account-info-pg.log"
          if grep -Fq -- '--- SKIP:' "$RUNNER_TEMP/native-account-info-pg.log"; then exit 1; fi
          for critical in TestGatewayAccountInfoPostgresOrderingAtomicityAndReplacement TestGatewayAccountInfoCodexPostgresHydrationAndRefresh TestGatewayAccountInfoCodexPostgresConnectionBinding TestGatewayNativeOAuthImportPostgresClaimsReplayAndLostACK; do
            test "$(grep -c "^--- PASS: $critical " "$RUNNER_TEMP/native-account-info-pg.log")" -eq 1
          done

      - name: Native provider methods, source protocols and PostgreSQL recovery
        working-directory: backend
        env:
          GATEWAY_NATIVE_CONNECTION_TEST_DSN: postgres://native_contract_test@127.0.0.1:5432/native_connection_test_ci?sslmode=disable
          GATEWAY_NATIVE_OBSERVATIONS_TEST_DSN: postgres://native_contract_test@127.0.0.1:5432/native_observations_test_ci?sslmode=disable
          GATEWAY_NATIVE_DISPATCH_TEST_DSN: postgres://native_contract_test@127.0.0.1:5432/native_dispatch_test_ci?sslmode=disable
          GATEWAY_NATIVE_CODEX_CONNECTION_TEST_DSN: postgres://native_contract_test@127.0.0.1:5432/native_codex_connection_test_ci?sslmode=disable
          GATEWAY_NATIVE_SUBSCRIPTION_TEST_DSN: postgres://native_contract_test@127.0.0.1:5432/native_subscription_test_ci?sslmode=disable
          GATEWAY_NATIVE_CLOUD_CONNECTION_TEST_DSN: postgres://native_contract_test@127.0.0.1:5432/native_cloud_connection_test_ci?sslmode=disable
          GATEWAY_NATIVE_GEMINI_CONNECTION_TEST_DSN: postgres://native_contract_test@127.0.0.1:5432/native_gemini_connection_test_ci?sslmode=disable
          GATEWAY_NATIVE_LEGACY_RECOVERY_TEST_DSN: postgres://native_contract_test@127.0.0.1:5432/native_legacy_recovery_test_ci?sslmode=disable
          GATEWAY_NATIVE_EXTENSION_TEST_DSN: postgres://native_contract_test@127.0.0.1:5432/native_extension_test_ci?sslmode=disable
          GATEWAY_NATIVE_LIMITS_V2_TEST_DSN: postgres://native_contract_test@127.0.0.1:5432/gateway_limits_v2_test_ci?sslmode=disable
        run: |
          set -o pipefail
          for db in native_connection_test_ci native_observations_test_ci native_dispatch_test_ci native_codex_connection_test_ci native_subscription_test_ci native_cloud_connection_test_ci native_gemini_connection_test_ci native_legacy_recovery_test_ci native_extension_test_ci gateway_limits_v2_test_ci; do
            docker exec "${{ job.services.postgres.id }}" createdb -U native_contract_test "$db"
          done
          go test -tags unit ./internal/service ./internal/pkg/apicompat -run '^(TestGatewayConnection|TestGatewayNativeCloud|TestGemini|TestPrepareBedrockRequestBody_PreservesStructuredOutput|TestPrepareBedrockSonnet55PreservesEffort|TestClientToolSearchPreservesExplicitContractAcrossNativeCodecs|TestAdaptResponsesClientTools)' -count=1 -v | tee "$RUNNER_TEMP/native-method-contracts.log"
          if grep -Fq -- '--- SKIP:' "$RUNNER_TEMP/native-method-contracts.log"; then exit 1; fi
          for critical in TestPrepareBedrockRequestBody_PreservesStructuredOutput TestPrepareBedrockSonnet55PreservesEffort TestClientToolSearchPreservesExplicitContractAcrossNativeCodecs; do
            test "$(grep -c "^--- PASS: $critical " "$RUNNER_TEMP/native-method-contracts.log")" -eq 1
          done
          go test -tags gatewaycustody ./internal/repository -run '^TestGatewayNativeConnectionPostgres(LifecycleAndLostACK|Observations|ProtocolMatrix|CodexVariants|SubscriptionMethods|CloudSigningAndStreams|GeminiAndAntigravity|LegacyRecoveryWithoutMount)$|^TestGatewayAccountLimitsV2KeyPostgres$' -count=1 -v -timeout 300s | tee "$RUNNER_TEMP/native-method-postgres.log"
          if grep -Fq -- '--- SKIP:' "$RUNNER_TEMP/native-method-postgres.log"; then exit 1; fi
          for critical in \
            TestGatewayNativeConnectionPostgresLifecycleAndLostACK \
            TestGatewayNativeConnectionPostgresObservations \
            TestGatewayNativeConnectionPostgresProtocolMatrix \
            TestGatewayNativeConnectionPostgresCodexVariants \
            TestGatewayNativeConnectionPostgresSubscriptionMethods \
            TestGatewayNativeConnectionPostgresCloudSigningAndStreams \
            TestGatewayNativeConnectionPostgresGeminiAndAntigravity \
            TestGatewayNativeConnectionPostgresLegacyRecoveryWithoutMount \
            TestGatewayAccountLimitsV2KeyPostgres; do
            test "$(grep -c "^--- PASS: $critical " "$RUNNER_TEMP/native-method-postgres.log")" -eq 1
          done
          go test -tags gatewaycustody ./internal/gatewaybootstrap -run '^TestNativeConnectionJoined(SchemaOracleRetainsConstraints|OpenRouterReasoningReplay|ErasureEvidence)$' -count=1 -v | tee "$RUNNER_TEMP/native-schema-oracle.log"
          for critical in TestNativeConnectionJoinedSchemaOracleRetainsConstraints TestNativeConnectionJoinedOpenRouterReasoningReplay TestNativeConnectionJoinedErasureEvidence; do
            test "$(grep -c "^--- PASS: $critical " "$RUNNER_TEMP/native-schema-oracle.log")" -eq 1
          done
          if grep -Fq -- '--- SKIP:' "$RUNNER_TEMP/native-schema-oracle.log"; then exit 1; fi
          go test -tags gatewaycustody,gatewayextension ./internal/repository -run '^TestGatewayNativeExtensionPostgresStreamAndQuota$' -count=1 -v -timeout 180s | tee "$RUNNER_TEMP/native-extension-postgres.log"
          test "$(grep -c '^--- PASS: TestGatewayNativeExtensionPostgresStreamAndQuota ' "$RUNNER_TEMP/native-extension-postgres.log")" -eq 1
          if grep -Fq -- '--- SKIP:' "$RUNNER_TEMP/native-extension-postgres.log"; then exit 1; fi

      - name: OAuth joined descriptor wire and PostgreSQL connect lifecycle
        working-directory: backend
        env:
          GATEWAY_NATIVE_OAUTH_CONNECT_TEST_DSN: postgres://native_contract_test@127.0.0.1:5432/gateway_oauth_connect_test_ci?sslmode=disable
          GATEWAY_NATIVE_OAUTH_RECONNECT_TEST_DSN: postgres://native_contract_test@127.0.0.1:5432/gateway_oauth_reconnect_test_ci?sslmode=disable
        run: |
          set -o pipefail
          docker exec "${{ job.services.postgres.id }}" createdb -U native_contract_test gateway_oauth_connect_test_ci
          docker exec "${{ job.services.postgres.id }}" createdb -U native_contract_test gateway_oauth_reconnect_test_ci
          go test -tags unit ./internal/handler/admin -run '^TestGatewayOAuthDescriptorHTTPJoinedSuccessWire$' -count=1 -v | tee "$RUNNER_TEMP/native-oauth-joined-wire.log"
          test "$(grep -c '^--- PASS: TestGatewayOAuthDescriptorHTTPJoinedSuccessWire ' "$RUNNER_TEMP/native-oauth-joined-wire.log")" -eq 1
          if grep -Fq -- '--- SKIP:' "$RUNNER_TEMP/native-oauth-joined-wire.log"; then exit 1; fi
          go test -tags unit ./internal/repository -run '^TestGatewayNativeOAuthConnectPostgresOneEntryLostACKAndRestart$' -count=1 -v -timeout 180s | tee "$RUNNER_TEMP/native-oauth-connect-pg.log"
          test "$(grep -c '^--- PASS: TestGatewayNativeOAuthConnectPostgresOneEntryLostACKAndRestart ' "$RUNNER_TEMP/native-oauth-connect-pg.log")" -eq 1
          if grep -Fq -- '--- SKIP:' "$RUNNER_TEMP/native-oauth-connect-pg.log"; then exit 1; fi
          go test -tags unit ./internal/repository -run '^TestGatewayNativeOAuthReconnectPostgresClaimsAndBackfill$' -count=1 -v -timeout 180s | tee "$RUNNER_TEMP/native-oauth-reconnect-pg.log"
          test "$(grep -c '^--- PASS: TestGatewayNativeOAuthReconnectPostgresClaimsAndBackfill ' "$RUNNER_TEMP/native-oauth-reconnect-pg.log")" -eq 1
          if grep -Fq -- '--- SKIP:' "$RUNNER_TEMP/native-oauth-reconnect-pg.log"; then exit 1; fi

      - name: Claude OAuth lifecycle, passive quota and protected Messages transport
        working-directory: backend
        env:
          GATEWAY_NATIVE_CLAUDE_TEST_DSN: postgres://native_contract_test@127.0.0.1:5432/gateway_claude_test_ci?sslmode=disable
          GATEWAY_NATIVE_CLAUDE_STREAM_TEST_DSN: postgres://native_contract_test@127.0.0.1:5432/gateway_claude_stream_test_ci?sslmode=disable
        run: |
          set -o pipefail
          docker exec "${{ job.services.postgres.id }}" createdb -U native_contract_test gateway_claude_test_ci
          docker exec "${{ job.services.postgres.id }}" createdb -U native_contract_test gateway_claude_stream_test_ci
          go test -tags unit ./internal/pkg/apicompat -run '^TestResponsesToAnthropicProtectedThinkingPreservesNativeStreamRoundtrip$' -count=1 -v | tee "$RUNNER_TEMP/native-claude-thinking-codec.log"
          test "$(grep -c '^--- PASS: TestResponsesToAnthropicProtectedThinkingPreservesNativeStreamRoundtrip ' "$RUNNER_TEMP/native-claude-thinking-codec.log")" -eq 1
          if grep -Fq -- '--- SKIP:' "$RUNNER_TEMP/native-claude-thinking-codec.log"; then exit 1; fi
          go test -tags unit ./internal/service ./internal/gatewaytransport -run '^(TestGateway(Native)?Claude|TestClaudePrivateHTTP)' -count=1 -v | tee "$RUNNER_TEMP/native-claude-boundary.log"
          if grep -Fq -- '--- SKIP:' "$RUNNER_TEMP/native-claude-boundary.log"; then exit 1; fi
          for critical in \
            TestGatewayClaudePassiveHeaderTruthAndInertRead \
            TestGatewayClaudeOAuthSourceIdentityAndCustody \
            TestGatewayClaudeCustodyContainedFromOrdinaryAccounts \
            TestGatewayNativeClaudeResponsesDispatchLifecycle \
            TestGatewayNativeClaudeResponsesRejectsLossyInput \
            TestGatewayNativeClaudeOAuthAttributionPreservesCanonicalIntent \
            TestGatewayNativeClaudeReviewPreservesToolsSchemaAndOriginalOutputConstraint \
            TestGatewayClaudeContinuationBindsCurrentOwnerBirthMethodAndCredentialRevision \
            TestGatewayClaudeThinkingCarrierSealsExactNativeOutputAndRejectsTampering \
            TestClaudePrivateHTTPRejectsLossyPayloadBeforeAdmission; do
            test "$(grep -c "^--- PASS: $critical " "$RUNNER_TEMP/native-claude-boundary.log")" -eq 1
          done
          go test -tags unit ./internal/repository -run '^TestGatewayNativeClaudePostgres(LifecycleAndPassiveLimits|StreamsReleaseSQLAtHeaders)$' -count=1 -v -timeout 180s | tee "$RUNNER_TEMP/native-claude-pg.log"
          test "$(grep -c '^--- PASS: TestGatewayNativeClaudePostgresLifecycleAndPassiveLimits ' "$RUNNER_TEMP/native-claude-pg.log")" -eq 1
          test "$(grep -c '^--- PASS: TestGatewayNativeClaudePostgresStreamsReleaseSQLAtHeaders ' "$RUNNER_TEMP/native-claude-pg.log")" -eq 1
          if grep -Fq -- '--- SKIP:' "$RUNNER_TEMP/native-claude-pg.log"; then exit 1; fi

      - name: Encrypted native custody and actual backup restore
        working-directory: backend
        env:
          GATEWAY_NATIVE_CUSTODY_PG_DSN: postgres://native_contract_test@127.0.0.1:5432/native_custody_ci?sslmode=disable
          GATEWAY_NATIVE_CUSTODY_RESTORE_PG_DSN: postgres://native_contract_test@127.0.0.1:5432/native_custody_restore_ci?sslmode=disable
          GATEWAY_NATIVE_CUSTODY_API_PG_DSN: postgres://native_contract_test@127.0.0.1:5432/native_custody_api_ci?sslmode=disable
        run: |
          set -o pipefail
          for db in native_custody_ci native_custody_restore_ci native_custody_api_ci; do
            docker exec "${{ job.services.postgres.id }}" createdb -U native_contract_test "$db"
          done
          mkdir -p "$RUNNER_TEMP/native-custody-pg-bin"
          printf '#!/bin/sh\nexec docker exec %s pg_dump "$@"\n' "${{ job.services.postgres.id }}" > "$RUNNER_TEMP/native-custody-pg-bin/pg_dump"
          chmod 755 "$RUNNER_TEMP/native-custody-pg-bin/pg_dump"
          printf '#!/bin/sh\nexec docker exec -i %s psql "$@"\n' "${{ job.services.postgres.id }}" > "$RUNNER_TEMP/native-custody-pg-bin/psql"
          chmod 755 "$RUNNER_TEMP/native-custody-pg-bin/psql"
          export PATH="$RUNNER_TEMP/native-custody-pg-bin:$PATH"
          pg_dump --version
          go test -tags gatewaycustody ./internal/repository -run '^TestGatewayNativeCustodyPostgresAndRestore$' -count=1 -v -timeout 180s | tee /tmp/native-custody-restore.log
          test "$(sed -n '/^--- PASS: TestGatewayNativeCustodyPostgresAndRestore /p' /tmp/native-custody-restore.log | wc -l)" -eq 1
          if grep -Fq -- '--- SKIP:' /tmp/native-custody-restore.log; then exit 1; fi
          go test -tags integration ./internal/handler/admin -run '^TestGatewayNativeCustodyPrivateAPIPostgres$' -count=1 -v -timeout 180s | tee /tmp/native-custody-api.log
          test "$(sed -n '/^--- PASS: TestGatewayNativeCustodyPrivateAPIPostgres /p' /tmp/native-custody-api.log | wc -l)" -eq 1
          if grep -Fq -- '--- SKIP:' /tmp/native-custody-api.log; then exit 1; fi

      - name: Protected bootstrap and original transport closure
        working-directory: backend
        run: |
          set -o pipefail
          fixture_dir="$RUNNER_TEMP/native-bootstrap"
          mkdir -p "$fixture_dir"
          image='postgres@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317'
          go build -o "$fixture_dir/gateway-native" ./cmd/gateway-native
          go test -tags unit -race ./internal/service -run '^TestNEWTESTNativeLifetime' -count=1 -v | tee "$fixture_dir/lifetime.log"
          if grep -Fq -- '--- SKIP:' "$fixture_dir/lifetime.log"; then
            exit 1
          fi
          for critical in \
            TestNEWTESTNativeLifetimeDelayedCancelPreservesCompletedHTTP \
            TestNEWTESTNativeLifetimeHeldBodyCancel \
            TestNEWTESTNativeLifetimeRealBodyCloseErrorIsRetained \
            TestNEWTESTNativeLifetimeBlockedCloseDoesNotBlockCancel \
            TestNEWTESTNativeLifetimeOvercapAndSealedEntry \
            TestNEWTESTNativeLifetimeOriginalWriterBlockedWrite \
            TestNEWTESTNativeLifetimeSecondCallDoesNotReenterHTTP \
            TestNEWTESTNativeLifetimeActualSSEParser; do
            test "$(grep -c "^--- PASS: $critical " "$fixture_dir/lifetime.log")" -eq 1
          done
          for suite in bootstrap transport launcher; do
            go test -tags unit -race -c -o "$fixture_dir/$suite.test" "./internal/gateway$suite"
            selection='.'
            if [ "$suite" = launcher ]; then selection='^TestBootstrap'; fi
            memory_limit=768m
            fixture_args=()
            # User stopped the optional max-copy RAM sampler; preserve source and prior FAIL.
            # Retain all other correctness fixtures and the existing CI/product limits.
            if [ "$suite" = transport ]; then memory_limit=4g; fixture_args=('-test.skip=^TestGatewayNativeMiMoMaximumCopy32$'); fi
            docker run --rm --network none --memory "$memory_limit" --cpus 2 --pids-limit 256 \
              --cap-add SYS_ADMIN --cap-add CHECKPOINT_RESTORE --security-opt seccomp=unconfined \
              -v "$fixture_dir/$suite.test:/fixture.test:ro" "$image" \
              /fixture.test -test.v -test.timeout=3m "-test.run=$selection" "${fixture_args[@]}" | tee "$fixture_dir/$suite.log"
            if grep -Fq -- '--- SKIP:' "$fixture_dir/$suite.log"; then
              exit 1
            fi
            test "$(grep -c '^--- PASS:' "$fixture_dir/$suite.log")" -gt 1
          done
          go test -tags integration -race -c -o "$fixture_dir/pg.test" ./internal/gatewaybootstrap
          docker exec "${{ job.services.postgres.id }}" createdb -U native_contract_test native_bootstrap_ci
          docker run --rm --network "container:${{ job.services.postgres.id }}" \
            --memory 768m --cpus 2 --pids-limit 256 \
            --cap-add SYS_ADMIN --cap-add CHECKPOINT_RESTORE --security-opt seccomp=unconfined \
            -v "$fixture_dir/pg.test:/fixture.test:ro" \
            -e 'GATEWAY_NATIVE_BOOTSTRAP_PG_DSN=postgres://native_contract_test@127.0.0.1:5432/native_bootstrap_ci?sslmode=disable' \
            "$image" /fixture.test -test.v -test.timeout=3m \
            '-test.run=^TestNativeProtectedReadyEnrollmentAndShutdown$' | tee "$fixture_dir/pg.log"
          if grep -Fq -- '--- SKIP:' "$fixture_dir/pg.log"; then
            exit 1
          fi
          grep -q '^--- PASS: TestNativeProtectedReadyEnrollmentAndShutdown ' "$fixture_dir/pg.log"


      - name: Foreground native service entry command
        working-directory: backend
        run: |
          set -o pipefail
          go build -o "$RUNNER_TEMP/account-gateway" ./cmd/account-gateway
          go vet ./cmd/account-gateway
          go test ./cmd/account-gateway -skip '^TestActualRetirementCLI$' -count=1 -v | tee "$RUNNER_TEMP/account-gateway-entry.log"
          sudo -n env PATH="$(dirname "$(command -v go)"):/usr/bin:/bin" \
            HOME="$HOME" GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" \
            GOPATH="$(go env GOPATH)" TMPDIR="$RUNNER_TEMP" \
            GOTOOLCHAIN=local GOENV=off GOPROXY=off GOSUMDB=off GOVCS='*:off' \
            go test ./cmd/account-gateway -run '^TestActualRetirementCLI$' -count=1 -v \
            | tee -a "$RUNNER_TEMP/account-gateway-entry.log"
          if grep -Fq -- '--- SKIP:' "$RUNNER_TEMP/account-gateway-entry.log"; then
            exit 1
          fi
          for critical in TestEmittedBindingPreservesKernelIdentity TestClosedDiagnosticPipeReturnsBootstrapFailure TestActualRetirementCLI; do
            test "$(grep -c "^--- PASS: $critical " "$RUNNER_TEMP/account-gateway-entry.log")" -eq 1
          done

  rollback_reader:
    name: Immutable native rollback reader and new journal states
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      ROLLBACK_READER_REVISION: a59da2e24adec39b8b21a512bc6721bf7fa2a4c1
      ROLLBACK_BASE_IMAGE: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: backend/go.sum
      - name: Compile current writer and the exact compatible production reader
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test -z "$(git status --porcelain)"
          probe_root="$RUNNER_TEMP/native-rollback"
          reader_root="$RUNNER_TEMP/native-rollback-source"
          mkdir -p "$probe_root/image" "$probe_root/output"
          echo "NATIVE_ROLLBACK_ROOT=$probe_root" >> "$GITHUB_ENV"
          git fetch --no-tags origin "$ROLLBACK_READER_REVISION"
          git worktree add --detach "$reader_root" "$ROLLBACK_READER_REVISION"
          test "$(git -C "$reader_root" rev-parse HEAD)" = "$ROLLBACK_READER_REVISION"
          test -z "$(git -C "$reader_root" status --porcelain)"
          probe='backend/internal/repository/native_gateway_connection_rollback_probe_test.go'
          test ! -e "$reader_root/$probe"
          cp "$probe" "$reader_root/$probe"
          cmp "$probe" "$reader_root/$probe"
          test "$(git -C "$reader_root" ls-files --others --exclude-standard)" = "$probe"
          git -C "$reader_root" diff --exit-code
          (cd backend && go test -tags gatewaycustody -c -o "$probe_root/current-writer.test" ./internal/repository)
          (cd "$reader_root/backend" && go test -tags gatewaycustody -c -o "$probe_root/image/reader.test" ./internal/repository)
          git -C "$reader_root" diff --exit-code
          test -z "$(git status --porcelain)"
          cp backend/scripts/native-connection-rollback.sh "$probe_root/image/start.sh"
          chmod 555 "$probe_root/image/start.sh" "$probe_root/image/reader.test" "$probe_root/current-writer.test"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-rollback'
          probe = pathlib.Path('backend/internal/repository/native_gateway_connection_rollback_probe_test.go')
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          record = {
            'contract': 'native-connection-rollback-build/v1',
            'writerSource': os.environ['EXPECTED_REVISION'],
            'readerSource': os.environ['ROLLBACK_READER_REVISION'],
            'baseImage': os.environ['ROLLBACK_BASE_IMAGE'],
            'testOnlyOverlay': str(probe),
            'testOnlyOverlaySHA256': digest(probe),
            'writerSHA256': digest(root / 'current-writer.test'),
            'readerSHA256': digest(root / 'image/reader.test'),
            'qualificationImageOnly': True,
            'preParityRollbackQualified': False,
          }
          (root / 'output/build.json').write_text(json.dumps(record, indent=2) + '\n')
          (root / 'image/Dockerfile').write_text(
            'FROM ' + record['baseImage'] + '\n'
            'LABEL org.opencontainers.image.revision="' + record['readerSource'] + '"\n'
            'COPY reader.test /probe/reader.test\n'
            'COPY start.sh /probe/start.sh\n'
            'USER postgres\n'
            'ENTRYPOINT ["/probe/start.sh"]\n'
          )
          PY
      - name: Read new prepared, entered and unknown rows in the offline reader image
        run: |
          set -euo pipefail
          docker build --network none --tag native-rollback-reader:qualification "$NATIVE_ROLLBACK_ROOT/image"
          image_id="$(docker image inspect native-rollback-reader:qualification --format '{{.Id}}')"
          test "$(docker image inspect "$image_id" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$ROLLBACK_READER_REVISION"
          reader_uid="$(docker run --rm --network none --entrypoint id "$image_id" -u postgres)"
          reader_gid="$(docker run --rm --network none --entrypoint id "$image_id" -g postgres)"
          restore_owner() { sudo chown -R "$(id -u):$(id -g)" "$NATIVE_ROLLBACK_ROOT/output"; }
          trap restore_owner EXIT
          chmod 700 "$NATIVE_ROLLBACK_ROOT/output"
          sudo chown -R "$reader_uid:$reader_gid" "$NATIVE_ROLLBACK_ROOT/output"
          reader_sha="$(sha256sum "$NATIVE_ROLLBACK_ROOT/image/reader.test" | cut -d ' ' -f 1)"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 1536m --cpus 2 --pids-limit 256 --tmpfs /tmp:rw,exec,mode=1777,size=512m \
            --mount "type=bind,src=$NATIVE_ROLLBACK_ROOT/current-writer.test,dst=/probe/current-writer.test,readonly" \
            --mount "type=bind,src=$NATIVE_ROLLBACK_ROOT/output,dst=/probe/output" \
            -e "GATEWAY_NATIVE_ROLLBACK_READER_SOURCE=$ROLLBACK_READER_REVISION" \
            -e "GATEWAY_NATIVE_ROLLBACK_READER_SHA256=$reader_sha" "$image_id"
          restore_owner
          NATIVE_ROLLBACK_IMAGE_ID="$image_id" python3 - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ['NATIVE_ROLLBACK_ROOT']) / 'output'
          build = json.loads((root / 'build.json').read_text())
          receipt = json.loads((root / 'native-rollback-reader.json').read_text())
          image = os.environ['NATIVE_ROLLBACK_IMAGE_ID']
          assert re.fullmatch(r'sha256:[a-f0-9]{64}', image)
          assert receipt['readerSource'] == build['readerSource']
          assert receipt['readerSHA256'] == build['readerSHA256']
          assert receipt['states'] == ['prepared', 'entered', 'unknown']
          assert all(receipt[key] is True for key in ['readOnly', 'noEntry', 'rowsUnchanged', 'materialPolicyPreserved'])
          build['readerImageID'] = image
          build['qualified'] = True
          (root / 'build.json').write_text(json.dumps(build, indent=2) + '\n')
          PY
      - name: Preserve safe rollback provenance and receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-rollback-reader-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-rollback/output
          if-no-files-found: error
          retention-days: 14
